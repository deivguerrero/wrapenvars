[project]
name = "wrapenvars"
version = "0.2.0"
description = "encode/decode base64 strings"
authors = [
    {name = "David Guerrero", email = "deivguerrero@gmail.com"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12.13, <3.14"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/deivguerrero/wrapenvars"
Repository = "https://github.com/deivguerrero/wrapenvars"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "Q", "S", "C4", "SIM", "TCH"]
fixable = ["ALL"]
ignore = ["B006", "B023"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
force-wrap-aliases = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 5
